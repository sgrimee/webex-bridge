name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The typed client's server-backed tests need both features.
      - run: cargo clippy --all-targets --features client -- -D warnings
      - run: cargo test --features client
      - name: Check client-only TUI contract and dependency graph
        run: ./scripts/check-client-only
