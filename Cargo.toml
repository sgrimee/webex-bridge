[package]
name = "webex-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Local Webex mirror and scoped agent channel"

[features]
default = ["server"]
server = []
client = []
# Requires a properly signed macOS app with Keychain access-group entitlement.
# Unsigned CLI/daemon builds use the login Keychain instead.
biometric-keychain = ["dep:security-framework"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4"
dirs = "6"
fs2 = "0.4"
gethostname = "1"
keyring = { version = "3.6.3", features = ["apple-native"] }
libc = "0.2"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
toml = "0.8"
tokio-tungstenite = "0.28"
webbrowser = "1"
webex = { path = "../webex-rust" }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Optional data-protection Keychain API for future entitled, signed builds.
security-framework = { version = "3.7.0", features = ["OSX_10_15"], optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[bin]]
name = "webex-bridged"
path = "src/bin/webex-bridged.rs"
required-features = ["server"]

[[bin]]
name = "webex-bridge"
path = "src/bin/webex-bridge.rs"
required-features = ["server"]
