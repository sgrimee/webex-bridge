[package]
name = "webex-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Local Webex mirror and scoped agent channel"

[features]
default = ["server"]
server = []
client = []

[dependencies]
anyhow = "1"
dirs = "6"
fs2 = "0.4"
gethostname = "1"
keyring = { version = "3.6.3", features = ["apple-native"] }
libc = "0.2"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
toml = "0.8"
tokio-tungstenite = "0.28"
webbrowser = "1"
webex = { path = "../webex-rust" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "webex-bridged"
path = "src/bin/webex-bridged.rs"
required-features = ["server"]

[[bin]]
name = "webex-bridge"
path = "src/bin/webex-bridge.rs"
required-features = ["server"]
