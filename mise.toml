[tools]
rust = "1.88"

[tasks.build]
description = "Build both local binaries and sign them for Keychain access"
run = "./scripts/sign-bridged-dev"

[tasks.check]
description = "Format-check, test, and lint"
run = """
cargo fmt --check
cargo test
cargo clippy --all-targets -- -D warnings
"""

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test"

[tasks."client-only"]
description = "Check the bridge-only TUI client contract and dependency graph"
run = "./scripts/check-client-only"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt"

[tasks."daemon:run"]
description = "Build, sign, and run the daemon in the foreground"
run = "./scripts/run-bridged-dev"

[tasks."service:start"]
description = "Build/sign, copy the verified binaries into the private bin/, then install and start the LaunchAgent"
depends = ["build"]
run = '"${CARGO_TARGET_DIR:-target}/debug/webex-bridge" install-service'

[tasks."service:stop"]
description = "Stop and remove the macOS LaunchAgent and its installed binaries"
run = '"$HOME/Library/Application Support/webex-bridge/bin/webex-bridge" uninstall-service'

[tasks."service:restart"]
description = "Build/sign, re-copy the verified binaries into the private bin/, then restart the LaunchAgent"
depends = ["build"]
run = '"${CARGO_TARGET_DIR:-target}/debug/webex-bridge" install-service'

[tasks."service:status"]
description = "Show bridge authentication and mirror progress (installed CLI)"
run = '"$HOME/Library/Application Support/webex-bridge/bin/webex-bridge" status'

[tasks."service:logs"]
description = "Follow redacted daemon lifecycle logs"
run = "tail -f ~/Library/Logs/webex-bridge/bridged.log"
